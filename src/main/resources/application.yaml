spring:
  application:
    name: msa5-spring
  web:
    error:
      include-stacktrace: never
      include-message: never
  # mySQL 접속 정보 설정
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbsample}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# mybatis 설정
mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: org.msa.msa5spring

logging:
  file:
    name: logs/error.log
  level:
    #error > warn > info > debug > trace
    root: warn
    org.msa.msa5spring: debug
debug: false
